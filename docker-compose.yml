version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trayenco_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trayenco_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trayenco_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      - postgres
    networks:
      - trayenco_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trayenco_client
    networks:
      - trayenco_net

  nginx:
    image: nginx:alpine
    container_name: trayenco_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
      - client
    networks:
      - trayenco_net

volumes:
  postgres_data:

networks:
  trayenco_net:
    driver: bridge
